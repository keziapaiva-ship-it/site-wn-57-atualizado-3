
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WN57 - Pagamento PIX</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="/css/login/cabecalho.css">
    <link rel="stylesheet" href="/css/corrida/pagamento.pix.css">
</head>

<body>

    <!-- Cabeçalho WN57 -->
    <script src="/javascript/login/cabecalho.js"></script>

    <!-- Mapa de fundo -->
    <div id="map"></div>

    <!-- Painel de pagamento -->
    <main class="painel">

        <div class="barra"></div>

        <span class="tag">WN57</span>

        <h2 id="tituloPagamento">Pagamento via PIX</h2>

        <p class="descricao" id="descricaoPagamento">
            Sua corrida foi finalizada! Realize o pagamento para concluir.
        </p>

        <!-- Valor da corrida -->
        <div class="valor-box">
            <small id="textoValor">Valor total da corrida</small>
            <h1 id="valor">R$ 15,00</h1>
        </div>

        <!-- QR Code -->
        <div class="qr">
            <img id="qrCode" alt="QR Code PIX">
        </div>

        <p class="instrucao" id="instrucaoPix">
            Abra o aplicativo do seu banco, escolha PIX e escaneie o QR Code.
        </p>

        <!-- Código PIX -->
        <div class="codigo">
            <input
                type="text"
                id="codigoPix"
                readonly
                aria-label="Código PIX para copiar"
            >

            <button
                type="button"
                id="botaoCopiar"
                onclick="copiarPix()"
            >
                Copiar
            </button>
        </div>

        <!-- Status do pagamento -->
        <div class="status">
            <span class="bolinha"></span>

            <span id="statusTexto">
                Aguardando confirmação do pagamento
            </span>
        </div>

        <!-- Confirmar pagamento -->
        <button
            class="botao"
            type="button"
            id="botaoConfirmar"
            onclick="confirmarPix()"
        >
            Já realizei o pagamento <i>→</i>
        </button>

        <!-- Voltar ao início -->
        <a
            class="voltar"
            href="/html/principal/inicial.html"
            id="voltarInicio"
        >
            Voltar ao início
        </a>

    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/javascript/corrida/pagamento.pix.js"></script>

</body>
</html>
