<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WN57 - Pagamento PIX</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- CSS DO CABEÇALHO (carrega primeiro) -->
    <link rel="stylesheet" href="/css/login/cabecalho.css">

    <!-- CSS DA PÁGINA (também importa o cabeçalho, veja o CSS abaixo) -->
    <link rel="stylesheet" href="/css/corrida/pagamento.pix.css">
</head>

<body>

    <!-- CABEÇALHO (menu + perfil) — gerado pelo cabecalho.js -->
    <script src="/javascript/login/cabecalho.js"></script>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- PAINEL PIX -->
    <main class="painel">

        <div class="barra"></div>

        <span class="tag">WN57</span>

        <h2 id="tituloPagamento">Pagamento via PIX</h2>

        <p class="descricao" id="descricaoPagamento">
            Sua corrida foi finalizada! Realize o pagamento para concluir.
        </p>

        <div class="valor-box">
            <small id="textoValor">Valor total da corrida</small>
            <h1 id="valor">R$ 15,00</h1>
        </div>

        <div class="qr">
            <img id="qrCode" alt="QR Code PIX">
        </div>

        <p class="instrucao" id="instrucaoPix">
            Abra o aplicativo do seu banco, escolha PIX e escaneie o QR Code.
        </p>

        <div class="codigo">
            <input id="codigoPix" readonly>

            <button type="button" id="botaoCopiar" onclick="copiarPix()">
                Copiar
            </button>
        </div>

        <div class="status">
            <span class="bolinha"></span>
            <span id="statusTexto">Aguardando confirmação do pagamento</span>
        </div>

        <button class="botao" type="button" id="botaoConfirmar" onclick="confirmarPix()">
            Já realizei o pagamento <i>→</i>
        </button>

        <a class="voltar" href="/html/principal/inicial.html" id="voltarInicio">
            Voltar ao início
        </a>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/javascript/corrida/pagamento.pix.js"></script>

</body>

</html>
