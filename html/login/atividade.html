<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas viagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
        rel="stylesheet">
<link rel="stylesheet" href="/css/login/atividade.css"
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="topo">
            <a class="logo" href="inicial.html"><img src="/site-de-corrida-wn-57-main/site-de-corrida-wn-57-main/site-wn-57-corrida-main/img/logo/logown57.png" alt="WN57"></a>

            <nav aria-label="Principal">
                <a href="/site-de-corrida-wn-57-main/site-de-corrida-wn-57-main/site-wn-57-corrida-main/html/inicial.html">Inicial</a>
            </nav>

            <div class="direita">
                <span class="idioma"><i class="fa-solid fa-globe"></i>PT-BR</span>
                <a href="#">Ajuda</a>

                <div class="perfil">
                    <button class="perfil-btn" id="perfilBtn" type="button" aria-haspopup="true" aria-expanded="false"
                        aria-controls="perfilMenu">
                        <span class="foto" id="fotoMini">K</span>
                        <span id="nomeMini">Conta</span>
                        <i class="fa-solid fa-caret-down seta"></i>
                    </button>

                    <div class="menu" id="perfilMenu">
                        <div class="menu-topo">
                            <div>
                                <h3 id="nomeCompleto">Usuário</h3>
                                <span class="nota-tag"><i class="fa-solid fa-star" style="font-size:.7rem"></i>
                                    5,00</span>
                            </div>
                            <div class="foto-grande" id="fotoGrande">K</div>
                        </div>

                        <div class="atalhos">
                            <a href="#"><i class="fa-solid fa-circle-xmark"></i>Ajuda</a>
                            <a href="#"><i class="fa-solid fa-wallet"></i>Carteira</a>
                            <a href="atividade.html" class="ativo"><i class="fa-solid fa-receipt"></i>Atividade</a>
                        </div>

                        <div class="lista-menu">
                            <a href="#"><i class="fa-solid fa-user"></i>Gerenciar conta</a>
                            <a href="solicitar.html"><i class="fa-solid fa-route"></i>Pedir corrida</a>
                            <a href="#"><i class="fa-solid fa-car"></i>Seja motorista</a>
                            <a href="#"><i class="fa-solid fa-comment"></i>Suporte</a>
                        </div>

                        <button class="sair" type="button" id="sair">Sair</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h1>Atividade</h1>
        <p class="sub">Acompanhe suas viagens agendadas e anteriores.</p>

        <section class="agendadas" aria-labelledby="ag">
            <div>
                <h2 id="ag">Você não tem viagens agendadas</h2>
                <p>Reserve com antecedência e viaje com tranquilidade.</p>
            </div>
            <button class="btn" type="button">Reservar viagem</button>
        </section>

        <div class="barra">
            <h2 class="sec">Anteriores</h2>
            <div class="filtros">
                <select aria-label="Perfil">
                    <option>Pessoal</option>
                    <option>Trabalho</option>
                </select>
                <select id="periodo" aria-label="Período">
                    <option value="todas">Todas as viagens</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="365">Este ano</option>
                </select>
            </div>
        </div>

        <div class="lista" id="lista">
        </div>
    </main>

    <script>
        const KEY = "minhasViagens";
        const moto = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5 9 9h4l3 7.5M13 9l2-3h3M9 9H6"/></svg>';
        const mapa = '<svg viewBox="0 0 260 220" preserveAspectRatio="xMidYMid slice"><rect width="260" height="220" fill="#fdeaf3"/><path d="M0 60H260M0 130H260M0 190H260M60 0V220M140 0V220M210 0V220" stroke="#fff" stroke-width="10"/><ellipse cx="45" cy="165" rx="40" ry="45" fill="#f3c6da"/><path d="M175 35V75H150V110H105V140H70V185" fill="none" stroke="#a81d63" stroke-width="5" stroke-linejoin="round"/><circle cx="175" cy="35" r="8" fill="#a81d63"/><circle cx="175" cy="35" r="3" fill="#fff"/><rect x="63" y="178" width="14" height="14" fill="#4a1230"/></svg>';

        const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const fmt = n => "R$ " + Number(n).toFixed(2).replace(".", ",");
        const dataHora = iso => { const d = new Date(iso); return d.toLocaleDateString("pt-BR", { day: "numeric", month: "short" }) + " • " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };

        function carregar() {
            try { return JSON.parse(localStorage.getItem(KEY) || "[]") } catch (e) { return [] }
        }

        function filtrar(lista) {
            const p = document.getElementById("periodo").value;
            if (p === "todas") return lista;
            const dias = p === "30" ? 30 : 365;
            const lim = Date.now() - dias * 86400000;
            return lista.filter(t => new Date(t.data).getTime() >= lim);
        }

        function card(t, destaque) {
            const canc = t.status === "cancelada";
            const status = `<span class="status ${canc ? "cancelada" : "ok"}">${canc ? "Cancelada" : "Concluída"}</span>`;
            if (destaque && !canc) {
                return `<article class="viagem destaque"><div class="mapa" aria-hidden="true">${mapa}</div><div class="corpo"><div class="linha"><div><h3 title="${esc(t.destino)}">${esc(t.destino)}</h3><p class="meta">${dataHora(t.data)}${t.pagamento ? " • " + esc(t.pagamento) : ""}</p>${status}</div><div class="valor">${fmt(t.valor)}</div></div><div class="acoes"><button class="chip" type="button">Ajuda</button><button class="chip" type="button">Informações</button></div></div></article>`;
            }
            return `<article class="viagem"><div class="icone" aria-hidden="true">${moto}</div><div><h3 title="${esc(t.destino)}">${esc(t.destino)}</h3><p class="meta">${dataHora(t.data)}${t.pagamento ? " • " + esc(t.pagamento) : ""}</p>${status}</div><div class="valor">${fmt(canc ? 0 : t.valor)}</div><div class="acoes"><button class="chip" type="button">Ajuda</button></div></article>`;
        }

        function render() {
            const el = document.getElementById("lista");
            const lista = filtrar(carregar()).sort((a, b) => new Date(b.data) - new Date(a.data));
            if (!lista.length) {
                el.innerHTML = '<div class="vazio"><strong>Nenhuma viagem ainda</strong>As corridas que você fizer vão aparecer aqui.</div>';
                return;
            }
            el.innerHTML = lista.map((t, i) => card(t, i === 0)).join("");
        }

        document.getElementById("periodo").addEventListener("change", render);
        window.addEventListener("storage", e => { if (e.key === KEY) render() }); // atualiza se outra aba salvar
        render();

        // ===== Perfil: dados vindos do cadastro.html =====
        (function () {
            // Lê um valor do localStorage (JSON ou texto)
            function ler(chave) {
                const bruto = localStorage.getItem(chave);
                if (bruto === null) return null;
                try { return JSON.parse(bruto) } catch (e) { return bruto }
            }

            const CHAVES_LISTA = ["usuarios", "users", "cadastros", "usuariosCadastrados", "listaUsuarios", "contas"];
            const CHAVES_UNICA = ["usuario", "dadosUsuario", "dadosCadastro", "cadastro", "user", "perfil"];

            function iguais(a, b) { return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase() }

            function acharUsuario() {
                const logado = ler("usuarioLogado");

                // 1) o login já guardou o cadastro inteiro
                if (logado && typeof logado === "object") return logado;

                // 2) o login guardou só e-mail / nome / id: procura na lista de cadastros
                if (logado) {
                    for (const chave of CHAVES_LISTA) {
                        const lista = ler(chave);
                        if (Array.isArray(lista)) {
                            const achou = lista.find(function (u) {
                                return u && typeof u === "object" && [u.email, u.login, u.usuario, u.cpf, u.id, u.nome].some(function (v) { return iguais(v, logado) });
                            });
                            if (achou) return achou;
                        }
                    }
                }

                // 3) o cadastro foi salvo como um único objeto
                for (const chave of CHAVES_UNICA) {
                    const u = ler(chave);
                    if (u && typeof u === "object" && !Array.isArray(u)) return u;
                }

                // 4) só existe um texto (provavelmente o nome)
                return typeof logado === "string" ? { nome: logado } : {};
            }

            const u = acharUsuario();
            console.log("Perfil carregado do cadastro:", u); // ajuda a conferir os nomes dos campos

            const primeiro = function () { for (const v of arguments) { if (v && String(v).trim()) return String(v).trim() } return "" };
            let nome = primeiro(u.nomeCompleto, u.nome_completo, u.fullName, u.nome, u.name, u.usuario);
            const sobrenome = primeiro(u.sobrenome, u.lastName, u.sobreNome);
            if (nome && sobrenome && !nome.toLowerCase().includes(sobrenome.toLowerCase())) nome += " " + sobrenome;
            nome = nome || "Minha conta";
            const foto = primeiro(u.foto, u.fotoPerfil, u.avatar, u.imagem, u.img);
            const inicial = nome.charAt(0).toUpperCase();

            document.getElementById("nomeCompleto").textContent = nome;
            document.getElementById("nomeMini").textContent = nome.split(" ")[0].toLowerCase();
            ["fotoMini", "fotoGrande"].forEach(function (id) {
                const el = document.getElementById(id);
                if (foto) { el.textContent = ""; const img = new Image(); img.src = foto; img.alt = ""; el.appendChild(img) }
                else el.textContent = inicial;
            });

            const btn = document.getElementById("perfilBtn"), menu = document.getElementById("perfilMenu");
            function alternar(ab) { menu.classList.toggle("aberto", ab); btn.setAttribute("aria-expanded", ab) }
            btn.addEventListener("click", function (e) { e.stopPropagation(); alternar(!menu.classList.contains("aberto")) });
            document.addEventListener("click", function (e) { if (!menu.contains(e.target)) alternar(false) });
            document.addEventListener("keydown", function (e) { if (e.key === "Escape") { alternar(false); btn.focus() } });
            document.getElementById("sair").addEventListener("click", function () {
                localStorage.removeItem("usuarioLogado");
                window.location.href = "login.html";
            });
        })();
    </script>
</body>

</html>
