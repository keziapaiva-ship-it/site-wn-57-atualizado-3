
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - WN57</title>

    <link rel="stylesheet" href="/css/login/cabecalho.css">
    <link rel="stylesheet" href="/css/login/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

    <!-- Cabeçalho compartilhado WN57 -->
    <script src="/javascript/login/cabecalho.js"></script>

    <main class="container">

        <!-- PAINEL DA MARCA -->
        <aside class="showcase" aria-hidden="true">

            <svg class="showcase-route" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
                <path class="trail" d="M90 420 C 200 500 330 330 270 250 S 430 120 500 110" />
                <circle class="start" cx="90" cy="420" r="7" />
                <circle class="pulse" cx="500" cy="110" r="9" />
                <circle class="end" cx="500" cy="110" r="9" />
            </svg>

            <h2>Seu próximo destino começa aqui.</h2>
            <p>Peça sua viagem, acompanhe o trajeto e chegue com tranquilidade.</p>

        </aside>

        <!-- LOGIN -->
        <section class="login-box">

            <header class="login-header">
                <h1>Bem-vindo de volta</h1>
                <p class="sub">Entre para continuar sua viagem.</p>
            </header>

            <form id="loginForm" novalidate>

                <!-- EMAIL -->
                <div class="input-box">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="voce@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- SENHA -->
                <div class="input-box">
                    <label for="senha">Senha</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="password-toggle"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >

                            <svg class="icon-show" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">

                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />

                            </svg>

                            <svg class="icon-hide" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">

                                <path d="M3 3l18 18" />
                                <path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2" />
                                <path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1" />
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />

                            </svg>

                        </button>
                    </div>
                </div>


                <!-- ERRO -->
                <p id="erroLogin" class="erro" role="alert"></p>

                <!-- BOTÃO -->
                <button type="submit" class="btn" id="btnEntrar">
                    <span id="textoBotao">Entrar</span>
                </button>

            </form>

            <!-- RODAPÉ -->
            <footer class="login-footer">
                <p class="link">
                    Não tem conta?
                    <a href="/html/login/cadastro.html">Criar conta</a>
                </p>
            </footer>

        </section>

    </main>

    <!-- MOSTRAR / OCULTAR SENHA -->
    <script>
        const senha = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");

        mostrarSenha.addEventListener("click", function () {
            const visivel = senha.type === "password";

            senha.type = visivel ? "text" : "password";

            mostrarSenha.setAttribute("aria-pressed", String(visivel));

            mostrarSenha.setAttribute(
                "aria-label",
                visivel ? "Ocultar senha" : "Mostrar senha"
            );
        });
    </script>

    <script src="/javascript/api.js"></script>
    <script src="/javascript/login/login.js"></script>

</body>
</html>
